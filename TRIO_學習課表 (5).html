<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIO 業務實戰課表 — S</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0e;
    --surface: #1a1a18;
    --surface2: #222220;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #e8e6df;
    --muted: #888880;
    --teal: #1D9E75;
    --teal-light: #5DCAA5;
    --blue: #378ADD;
    --amber: #EF9F27;
    --gray: #888780;
    --red: #E24B4A;
    --accent: #5DCAA5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 17px;
    line-height: 1.75;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .progress-summary {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .progress-summary span { color: var(--accent); }

  .main { max-width: 860px; margin: 0 auto; padding: 2rem; }

  .hero {
    margin-bottom: 2.5rem;
    padding: 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--teal), var(--blue), var(--amber));
  }

  .hero-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .hero-sub { color: var(--muted); font-size: 13px; margin-bottom: 1.5rem; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
  }

  .stat {
    background: var(--surface2);
    border-radius: 8px;
    padding: 0.75rem 1rem;
  }

  .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-family: 'DM Mono', monospace; }
  .stat-value { font-size: 20px; font-weight: 700; color: var(--text); font-family: 'DM Mono', monospace; }
  .stat-value.green { color: var(--teal-light); }
  .stat-value.amber { color: var(--amber); }

  .global-progress {
    margin-top: 1rem;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .global-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--blue));
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .weeks { display: flex; flex-direction: column; gap: 1.5rem; }

  .week {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .week-header {
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }

  .week-header:hover { background: var(--surface2); }

  .week-left { display: flex; align-items: center; gap: 12px; }

  .week-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .week-name { font-weight: 500; font-size: 15px; }
  .week-date { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 2px; }

  .week-right { display: flex; align-items: center; gap: 12px; }

  .week-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
  }

  .week-progress-text {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .chevron {
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.2s;
  }

  .chevron.open { transform: rotate(180deg); }

  .week-bar {
    height: 2px;
  }

  .lessons { display: none; }
  .lessons.open { display: block; }

  .lesson {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .lesson:last-child { border-bottom: none; }
  .lesson:hover { background: var(--surface2); }

  .lesson.done { opacity: 0.5; }
  .lesson.done .lesson-title { text-decoration: line-through; }
  .lesson.vacation { opacity: 0.4; pointer-events: none; }

  .cb {
    width: 18px; height: 18px;
    min-width: 18px;
    border: 1px solid var(--border2);
    border-radius: 4px;
    margin-top: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .cb:hover { border-color: var(--accent); }
  .cb.checked { background: var(--teal); border-color: var(--teal); }
  .cb.checked::after { content: '✓'; color: white; font-size: 11px; }

  .lesson-meta { flex: 1; }
  .day-label {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-bottom: 4px;
  }

  .lesson-title { font-size: 17px; color: var(--text); line-height: 1.6; font-weight: 500; }
  .lesson-tag { font-size: 14px; color: var(--muted); margin-top: 6px; }

  .lesson-date {
    font-size: 13px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
  }

  .start-btn {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .start-btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }

  .vacation-banner {
    background: var(--surface2);
    border: 1px dashed var(--border2);
    border-radius: 8px;
    padding: 1rem 1.5rem;
    margin: 1rem 1.5rem;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  .claude-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--teal);
    color: white;
    padding: 8px 18px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: opacity 0.15s;
  }

  .claude-link:hover { opacity: 0.85; }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    transition: all 0.15s;
  }

  .reset-btn:hover { border-color: var(--red); color: var(--red); }

  footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    border-top: 1px solid var(--border);
    margin-top: 3rem;
  }

  .note-area { padding: 0 1.5rem 1rem; border-bottom: 1px solid var(--border); }
  .note-toggle { background: transparent; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 8px 0; font-family: 'DM Mono', monospace; display: flex; align-items: center; gap: 6px; transition: color 0.15s; }
  .note-toggle:hover { color: var(--accent); }
  .note-box { display: none; margin-top: 8px; }
  .note-box.open { display: block; }
  .note-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Noto Sans TC', sans-serif; font-size: 16px; padding: 14px 16px; resize: vertical; min-height: 120px; line-height: 1.8; outline: none; transition: border-color 0.15s; }
  .note-input:focus { border-color: var(--accent); }
  .note-input::placeholder { color: var(--muted); }
  .note-saved { font-size: 13px; color: var(--teal-light); font-family: 'DM Mono', monospace; margin-top: 6px; opacity: 0; transition: opacity 0.3s; }
  .note-saved.show { opacity: 1; }
  .has-note .note-toggle { color: var(--amber); }
  .export-btn { background: transparent; border: 1px solid var(--border2); color: var(--text); padding: 8px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; transition: all 0.15s; }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }
  .week-name { font-weight: 500; font-size: 17px; }
  .week-date { font-size: 13px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 2px; }
  .day-label { font-size: 13px; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 6px; }
  .stat-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; font-family: 'DM Mono', monospace; }
  .stat-value { font-size: 24px; font-weight: 700; color: var(--text); font-family: 'DM Mono', monospace; }

  @media (max-width: 600px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .main { padding: 1rem; }
    header { padding: 1rem; }
    .lesson { gap: 10px; }
    .start-btn { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">TRIO // 業務實戰課表</div>
  <div class="header-right">
    <div class="progress-summary">完成 <span id="hdr-done">0</span> / 20 堂</div>
    <span id="sync-status" style="font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;"></span>
    <button class="export-btn" onclick="exportNotes()">匯出筆記 →</button>
    <button class="reset-btn" onclick="resetAll()">重置</button>
  </div>
</header>

<div class="main">

  <div class="hero">
    <div class="hero-title">S 的 20 天衝刺計畫</div>
    <div class="hero-sub">2025/5/3 → 2026/6/1　每天 1–2 小時　目標：進公司即戰力</div>
    <div class="stats-row">
      <div class="stat">
        <div class="stat-label">完成堂數</div>

        <div class="stat-label">上班倒數</div>
        <div class="stat-value amber" id="stat-days">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">越南出發</div>
        <div class="stat-value" style="font-size:14px;padding-top:4px;color:var(--muted);">5/19–5/23</div>
      </div>
    </div>
    <div class="global-progress"><div class="global-bar" id="global-bar"></div></div>
  </div>

  <div class="weeks" id="weeks-container"></div>

  <div style="text-align:center;margin-top:2rem;padding:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;">
    <div style="font-size:13px;color:var(--muted);margin-bottom:1rem;">點「開始」按鈕後，複製指令貼到 Claude 開始學習</div>
    <a href="https://claude.ai" target="_blank" class="claude-link">前往 Claude.ai ↗</a>
  </div>

</div>

<footer>made for S · TRIO Industries · 2026</footer>

<script>
const WEEKS = [
  {
    id: 'w1',

      { day:'D2', date:'5/6', title:'報價單結構拆解：成本＋加工＋利潤＋MOQ怎麼連動', tag:'實作：自己填一張空白報價單', prompt:'教我報價單的完整結構：成本、加工費、利潤、MOQ之間如何連動？並給我一張空白報價單框架讓我練習填寫。背景：我在泰國台商塑膠射出廠做業務。' },
      { day:'D3', date:'5/7', title:'B2B客戶心理：他為什麼換供應商？他怕什麼？', tag:'主動回想：列出客戶3大痛點', prompt:'用主動回想技巧教我B2B客戶心理：一個採購為什麼會換供應商？他最怕什麼？最在意什麼？以塑膠零件採購為例，幫我整理出3大痛點並教我怎麼應對。' },
      { day:'D4', date:'5/8', title:'第一封重啟信怎麼寫：斷聯客戶的破冰邏輯', tag:'實作：寫出一封模板', prompt:'教我寫給斷聯舊客戶的重啟信。背景：我是新進業務，接手舊客戶關係修復。客戶可能因為品質、價格、服務等原因流失。幫我整理破冰邏輯，並寫出一封英文模板。' },
      { day:'D5', date:'5/9', title:'週複習：費曼測試，解釋這週學的給我聽', tag:'主動回想：不看筆記直接說', prompt:'請考我第一週的所有內容（毛利率、報價單結構、B2B客戶心理、重啟信）。用費曼測試方式：先讓我解釋，你再指出哪裡不清楚或不正確。開始考試。', test:true },
    ]

  {

      { day:'D8', date:'5/14', title:'客訴現場處理SOP：道歉→釐清→承諾→追蹤', tag:'情境演練：品質客訴', prompt:'教我客訴處理的完整SOP：道歉、釐清事實、承諾解決、後續追蹤。重點是如何在不傷害關係的前提下保護公司立場。教完後模擬一個品質客訴情境讓我練習。' },

    lessons: [
      { day:'D16', date:'5/29', title:'競爭對手分析：如果我是對手怎麼打你（延伸）', tag:'建立你的防禦話術', prompt:'延續之前分析：假設我是TRIO的競爭對手，我要怎麼打TRIO（有模具＋射出＋物流的台商廠）？分析完後，幫我建立TRIO的防禦話術，當客戶說「別家更便宜」時怎麼回應。' },
      { day:'D17', date:'5/30', title:'產能×訂單×報價：整合計算實戰題', tag:'給你一個情境，你來算出最佳方案', prompt:'給我一道整合計算題，包含：產能限制、現有訂單、新客戶報價決策。我要從數字算出：能不能接、底價多少、如何跟老闆報告。你出題，我來算，算完你評估對不對。' },
      { day:'D18', date:'5/31', title:'進公司第一週腳本：每天要做什麼、要問誰', tag:'對應入職提問清單', prompt:'幫我設計進入TRIO第一週的每日行動腳本：Week 1 Day 1-5各自的優先任務、要找誰談、要取得什麼資訊。結合之前整理的入職提問清單，給我一個清晰的行動計畫。' },
      { day:'D19', date:'6/7', title:'最終壓力測試：全英文難搞客戶談判', tag:'30分鐘不間斷情境模擬', prompt:'Final pressure test. You are a difficult procurement manager from a European company. I am the new BD from TRIO Industries (Thai plastic injection molder). You have not ordered from us for 2 years due to quality issues. I will call you to restart the relationship. Start the conversation now. Be tough.', test:true },
      { day:'D20', date:'6/8', title:'總複習：費曼測試所有20天內容，找出知識漏洞', tag:'準備出發', prompt:'對我做20天課程的全面費曼測試。先讓我自己解說：1)報價數字邏輯 2)談判策略 3)客戶修復流程 4)競爭應對。你記錄我說不清楚的地方，最後列出我的知識漏洞清單。開始。', test:true },
    ]
  }
];

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyiOGvrBRvIPf6DmZbvJnY1crsUH0vi47mAqDzUfoNASHutpjAM_LTxSKHeRI3VBnLVZw/exec';
const STORAGE_KEY = 'trio_course_progress';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}

function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

let progress = loadProgress();

async function syncFromSheet() {
  const statusEl = document.getElementById('sync-status');
  try {
    statusEl.textContent = '同步中...';
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    Object.keys(data).forEach(k => {
      progress['note_' + k] = data[k];
    });
    saveProgress(progress);
    statusEl.textContent = '已從 Google Sheet 同步 ✓';
    setTimeout(() => statusEl.textContent = '', 3000);
    render();
  } catch(e) {
    statusEl.textContent = '同步失敗，使用本機資料';
    setTimeout(() => statusEl.textContent = '', 3000);
  }
}

async function pushNoteToSheet(key, val, title) {
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'save', key, note: val, title }),
    });
  } catch(e) { console.warn('Sheet sync failed, note saved locally'); }
}

function copyPrompt(prompt, btn) {
  navigator.clipboard.writeText(prompt).then(() => {
    const orig = btn.textContent;
    btn.textContent = '已複製 ✓';
    btn.style.borderColor = '#1D9E75';
    btn.style.color = '#5DCAA5';
    setTimeout(() => { btn.textContent = orig; btn.style.borderColor = ''; btn.style.color = ''; }, 2000);
  });
}

function toggleLesson(weekId, dayId) {
  const key = weekId + '_' + dayId;
  progress[key] = !progress[key];
  saveProgress(progress);
  render();
}

function toggleWeek(weekId) {
  const el = document.getElementById('lessons_' + weekId);
  const ch = document.getElementById('chev_' + weekId);
  if (el.classList.contains('open')) {
    el.classList.remove('open');
    ch.classList.remove('open');
  } else {
    el.classList.add('open');
    ch.classList.add('open');
  }
}

function resetAll() {
  if (confirm('確定要重置所有進度嗎？')) {
    progress = {};
    saveProgress(progress);
    render();
  }
}

function countdownDays() {
  const target = new Date('2026-06-01');
  const now = new Date();
  const diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
  return diff > 0 ? diff + ' 天' : '出發了！';
}

function render() {
  const container = document.getElementById('weeks-container');
  let totalDone = 0;
  let html = '';

  WEEKS.forEach(week => {
    const weekDone = week.lessons.filter(l => progress[week.id + '_' + l.day]).length;
    totalDone += weekDone;

    html += `
    <div class="week">
      <div class="week-bar" style="background:${week.color};opacity:0.6;"></div>
      <div class="week-header" onclick="toggleWeek('${week.id}')">
        <div class="week-left">
          <div class="week-dot" style="background:${week.color};"></div>
          <div>
            <div class="week-name">${week.name}</div>
            <div class="week-date">${week.sub}</div>
          </div>
        </div>
        <div class="week-right">
          <span class="week-badge" style="${week.badgeStyle}">${week.badge}</span>
          <span class="week-progress-text">${weekDone}/${week.lessons.length}</span>
          <span class="chevron open" id="chev_${week.id}">▾</span>
        </div>
      </div>
      <div class="lessons open" id="lessons_${week.id}">`;

    if (week.vacation) {
      html += `<div class="vacation-banner">✈ ${week.vacation.note}</div>`;
    }

    week.lessons.forEach(l => {
      const key = week.id + '_' + l.day;
      const noteKey = 'note_' + key;
      const done = !!progress[key];
      const hasNote = !!(progress[noteKey] && progress[noteKey].trim());
      html += `
      <div class="lesson ${done ? 'done' : ''}" id="lesson_${key}">
        <div class="cb ${done ? 'checked' : ''}" onclick="toggleLesson('${week.id}','${l.day}')"></div>
        <div class="lesson-meta">
          <div class="day-label">${l.day} · ${l.date}</div>
          <div class="lesson-title">${l.title}</div>
          <div class="lesson-tag">${l.tag}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
          <button class="start-btn" onclick="copyPrompt(${JSON.stringify(l.prompt)}, this)">${l.test ? '開始測試 ↗' : '複製指令 ↗'}</button>
        </div>
      </div>
      <div class="note-area ${hasNote ? 'has-note' : ''}" id="notearea_${key}">
        <button class="note-toggle" onclick="toggleNote('${key}')">
          <span>${hasNote ? '📝' : '+'}</span> ${hasNote ? '查看筆記' : '新增筆記'}
        </button>
        <div class="note-box" id="notebox_${key}">
          <textarea class="note-input" id="noteinput_${key}" placeholder="在這裡記下重點、心得、或待複習的地方..." oninput="saveNote('${key}', ${JSON.stringify(l.title)})">${progress[noteKey] || ''}</textarea>
          <div class="note-saved" id="notesaved_${key}">已儲存至 Google Sheet ✓</div>
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  container.innerHTML = html;

  document.getElementById('stat-done').textContent = totalDone;
  document.getElementById('stat-left').textContent = 20 - totalDone;
  document.getElementById('stat-days').textContent = countdownDays();
  document.getElementById('hdr-done').textContent = totalDone;
  document.getElementById('global-bar').style.width = (totalDone / 20 * 100) + '%';
}

function exportNotes() {
  const statusEl = document.getElementById('sync-status');
  let hasAny = false;
  const pushPromises = [];

  WEEKS.forEach(week => {
    week.lessons.forEach(l => {
      const noteKey = 'note_' + week.id + '_' + l.day;
      const note = progress[noteKey];
      if (note && note.trim()) {
        hasAny = true;
        pushPromises.push(
          fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'save', key: week.id + '_' + l.day, note: note.trim(), title: l.day + ' · ' + l.title }),
          })
        );
      }
    });
  });

  if (!hasAny) { alert('還沒有任何筆記，先寫一些再匯出！'); return; }

  statusEl.textContent = '匯出中...';
  Promise.all(pushPromises)
    .then(() => {
      statusEl.textContent = '已匯出到 Google Sheet ✓';
      setTimeout(() => statusEl.textContent = '', 3000);
      alert('全部筆記已匯出到 Google Sheet！\n去看「學習筆記」那個分頁。');
    })
    .catch(() => {
      statusEl.textContent = '匯出失敗';
      setTimeout(() => statusEl.textContent = '', 3000);
      alert('連線失敗，請確認網路後再試。');
    });
}

let noteTimers = {};

function toggleNote(key) {
  const box = document.getElementById('notebox_' + key);
  if (!box) return;
  const isOpen = box.classList.contains('open');
  box.classList.toggle('open');
  if (!isOpen) { setTimeout(() => { const ta = document.getElementById('noteinput_' + key); if(ta) ta.focus(); }, 50); }
}

function saveNote(key, title) {
  const ta = document.getElementById('noteinput_' + key);
  if (!ta) return;
  const val = ta.value;
  clearTimeout(noteTimers[key]);
  noteTimers[key] = setTimeout(async () => {
    const noteKey = 'note_' + key;
    progress[noteKey] = val;
    saveProgress(progress);
    await pushNoteToSheet(key, val, title);
    const saved = document.getElementById('notesaved_' + key);
    const area = document.getElementById('notearea_' + key);
    const btn = area?.querySelector('.note-toggle');
    const span = btn?.querySelector('span');
    if (saved) { saved.classList.add('show'); setTimeout(() => saved.classList.remove('show'), 2000); }
    if (val.trim()) {
      area?.classList.add('has-note');
      if (span) span.textContent = '📝';
    } else {
      area?.classList.remove('has-note');
      if (span) span.textContent = '+';
    }
  }, 800);
}

render();
syncFromSheet();
</script>
</body>
</html>
